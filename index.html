<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeucePhotos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0a09;
    --bg-tile: #17140f;
    --text: #f2efea;
    --text-dim: #948b80;
    --accent: #8b3a35;
  }
  *{ box-sizing: border-box; }
  html, body{ margin:0; padding:0; background:var(--bg); color:var(--text); }
  body{
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  a{ color:inherit; text-decoration:none; }

  header{
    display:flex; justify-content:space-between; align-items:center;
    padding: 28px 6vw;
    border-bottom: 1px solid rgba(242,239,234,0.08);
  }
  .wordmark{
    font-family:'Fraunces', serif; font-weight:500; font-size:1.15rem;
    letter-spacing:0.01em;
  }
  nav a{ margin-left: 28px; font-size:0.9rem; color:var(--text-dim); transition: color .2s ease; }
  nav a:hover{ color:var(--text); }

  .hero{
    padding: 9vh 6vw 7vh;
    max-width: 760px;
    opacity:0; transform: translateY(14px);
    animation: rise .9s ease-out .1s forwards;
  }
  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){ .hero{ animation:none; opacity:1; transform:none; } }

  .hero h1{
    font-family:'Fraunces', serif; font-weight:300; font-size: clamp(2.2rem, 5.5vw, 3.6rem);
    line-height:1.08; margin:0 0 18px;
  }
  .hero h1 em{ font-style:italic; color:var(--accent); }
  .hero p{ color:var(--text-dim); font-size:1.05rem; line-height:1.6; max-width:56ch; margin:0; }

  .gallery{
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 14px;
    padding: 0 6vw 10vh;
  }
  .tile{
    position:relative;
    background:var(--bg-tile);
    border:1px solid rgba(242,239,234,0.06);
    aspect-ratio: 1 / 1;
    overflow:hidden;
    display:flex; align-items:flex-end;
  }
  .tile img{
    width:100%; height:100%; object-fit:cover; display:block;
    filter:saturate(0.95);
    transition: transform .6s ease, filter .6s ease;
  }
  .tile:hover img{ transform:scale(1.04); filter:saturate(1.05); }
  .tile .cap{
    position:relative; z-index:1; padding:12px 14px; font-size:0.78rem; color:var(--text-dim);
  }
  .tile.placeholder .cap{ color: rgba(242,239,234,0.35); font-style:italic; }

  .tile.g1{ grid-column: span 3; grid-row: span 2; }
  .tile.g2{ grid-column: span 3; grid-row: span 1; }
  .tile.g3{ grid-column: span 2; grid-row: span 1; }
  .tile.g4{ grid-column: span 4; grid-row: span 2; }
  .tile.g5{ grid-column: span 2; grid-row: span 1; }
  .tile.g6{ grid-column: span 3; grid-row: span 1; }
  .tile.g7{ grid-column: span 3; grid-row: span 1; }

  @media (max-width: 720px){
    .gallery{ grid-template-columns: repeat(2, 1fr); }
    .tile{ grid-column: span 1 !important; grid-row: span 1 !important; }
  }

  footer{
    padding: 26px 6vw 40px;
    border-top: 1px solid rgba(242,239,234,0.08);
    display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px;
    font-size:0.85rem; color:var(--text-dim);
  }
</style>
</head>
<body>

  <header>
    <div class="wordmark">DeucePhotos</div>
    <nav>
      <a href="#work">Work</a>
      <a href="history.html">History</a>
      <a href="mailto:you@example.com">Contact</a>
    </nav>
  </header>

  <section class="hero">
    <h1>Photographs, made <em>quietly</em>, looked at closely.</h1>
    <p>A working portfolio — street, light, and the moments in between. New frames added as they're printed.</p>
  </section>

  <!--
    HOW TO ADD YOUR OWN PHOTOS:
    1. Create a folder named "images" in this repository and upload your photo files there.
    2. Replace the placeholder <div class="cap">…</div> lines below with:
         <img src="images/your-file-name.jpg" alt="short description of the photo">
       right inside the matching .tile div.
    3. Feel free to add/remove .tile divs — just keep one of the g1–g7 classes (or repeat them)
       so the asymmetric grid keeps its rhythm.
  -->
  <section class="gallery" id="work">
    <div class="tile g1"><img src="images/statue.jpg" alt="Statue of Benjamin Franklin seated inside a memorial hall"></div>
    <div class="tile g2"><img src="images/space-exhibit.jpg" alt="Child reaching toward a glowing planet exhibit in a space science museum"></div>
    <div class="tile g3"><img src="images/color-wall.jpg" alt="Person standing between two large screens of projected color and light"></div>
    <div class="tile g4"><img src="images/dark-ride.jpg" alt="Family lit in warm red and orange light during a dark ride"></div>
    <div class="tile g5"><img src="images/contrail.jpg" alt="Rocket contrail streaking through a blue evening sky above stadium lights"></div>
    <div class="tile placeholder g6"><div class="cap">06 — add photo</div></div>
    <div class="tile placeholder g7"><div class="cap">07 — add photo</div></div>
  </section>

  <footer>
    <span>© 2026 DeucePhotos</span>
    <span>Based wherever the light is good</span>
  </footer>

</body>
</html>
